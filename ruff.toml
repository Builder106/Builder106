# Ruff configuration for Builder106 Python scripts

target-version = "py312"
line-length = 120

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",   # line length (long embedded SVG strings)
    "RUF003", # ambiguous character in comments
]

[format]
quote-style = "double"
indent-style = "space"
