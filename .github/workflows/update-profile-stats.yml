name: Update profile stats

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Prepare card directory
        run: mkdir -p profile

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=Builder106&show_icons=true&theme=transparent"
          path: profile/stats.svg
          token: ${{ github.token }}
          fail_on_error: true

      - name: Generate languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=Builder106&layout=compact&langs_count=6&theme=transparent"
          path: profile/top-langs.svg
          token: ${{ github.token }}
          fail_on_error: true

      - name: Publish verified cards
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs");
            const paths = [
              "profile/stats.svg",
              "profile/top-langs.svg",
            ];
            const branchName = "chore/profile-stats";
            const { owner, repo } = context.repo;
            const { data: mainRef } = await github.rest.git.getRef({
              owner,
              repo,
              ref: "heads/main",
            });
            let parentSha = mainRef.object.sha;
            let branchExists = false;
            try {
              const { data: branchRef } = await github.rest.git.getRef({
                owner,
                repo,
                ref: `heads/${branchName}`,
              });
              parentSha = branchRef.object.sha;
              branchExists = true;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const { data: parent } = await github.rest.git.getCommit({
              owner,
              repo,
              commit_sha: parentSha,
            });
            const { data: baseTree } = await github.rest.git.getTree({
              owner,
              repo,
              tree_sha: parent.tree.sha,
              recursive: "true",
            });
            const tree = [];
            for (const path of paths) {
              const content = fs.readFileSync(path, "utf8");
              const existing = baseTree.tree.find((entry) => entry.path === path);
              if (existing?.type === "blob") {
                const { data: blob } = await github.rest.git.getBlob({
                  owner,
                  repo,
                  file_sha: existing.sha,
                });
                if (Buffer.from(blob.content, "base64").toString("utf8") === content) {
                  continue;
                }
              }
              tree.push({
                path,
                mode: "100644",
                type: "blob",
                content,
              });
            }
            if (tree.length === 0) {
              if (!branchExists) {
                core.info("Stats cards are already current.");
                return;
              }
            } else {
              const { data: nextTree } = await github.rest.git.createTree({
                owner,
                repo,
                base_tree: parent.tree.sha,
                tree,
              });
              const { data: commit } = await github.rest.git.createCommit({
                owner,
                repo,
                message: "chore(profile): refresh GitHub stats cards",
                tree: nextTree.sha,
                parents: [parentSha],
              });
              if (!commit.verification?.verified) {
                throw new Error(
                  `GitHub did not verify the generated cards commit: ${commit.verification?.reason ?? "unknown reason"}`,
                );
              }
              if (branchExists) {
                await github.rest.git.updateRef({
                  owner,
                  repo,
                  ref: `heads/${branchName}`,
                  sha: commit.sha,
                  force: false,
                });
              } else {
                await github.rest.git.createRef({
                  owner,
                  repo,
                  ref: `refs/heads/${branchName}`,
                  sha: commit.sha,
                });
              }
              parentSha = commit.sha;
            }

            const { data: openPullRequests } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head: `${owner}:${branchName}`,
              base: "main",
            });
            let pullRequest = openPullRequests[0];
            if (!pullRequest) {
              const { data } = await github.rest.pulls.create({
                owner,
                repo,
                title: "chore(profile): refresh GitHub stats cards",
                head: branchName,
                base: "main",
                body: "Refresh the generated stats and language cards in the profile README.",
              });
              pullRequest = data;
            }

            const { data: merge } = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pullRequest.number,
              merge_method: "squash",
              sha: parentSha,
            });
            if (!merge.merged) {
              throw new Error(`GitHub did not merge the stats pull request: ${merge.message}`);
            }
            const { data: mergeCommit } = await github.rest.git.getCommit({
              owner,
              repo,
              commit_sha: merge.sha,
            });
            if (!mergeCommit.verification?.verified) {
              throw new Error(
                `GitHub did not verify the merged cards commit: ${mergeCommit.verification?.reason ?? "unknown reason"}`,
              );
            }
            await github.rest.git.deleteRef({
              owner,
              repo,
              ref: `heads/${branchName}`,
            });
            core.info(`Published verified stats cards in ${merge.sha}.`);
